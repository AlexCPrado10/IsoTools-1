services:
  calculate-control-charts:
    build:
      context: .
      dockerfile: tools/calculate_control_charts/Docker/Dockerfile
    container_name: isotools-calculate-control-charts
    profiles: ["tools"]
    ports:
      - "8101:8101"
    environment:
      ISOTOOLS_API_URL: ${ISOTOOLS_API_URL:-https://tools.orcalabs.mx/api/v1}
      ISOTOOLS_API_KEY: ${ISOTOOLS_API_KEY_CALCULATE_CONTROL_CHARTS:-}

  detect-business-anomalies:
    build:
      context: .
      dockerfile: tools/detect_business_anomalies/Docker/Dockerfile
    container_name: isotools-detect-business-anomalies
    profiles: ["tools"]
    ports:
      - "8102:8101"
    environment:
      ISOTOOLS_API_URL: ${ISOTOOLS_API_URL:-https://tools.orcalabs.mx/api/v1}
      ISOTOOLS_API_KEY: ${ISOTOOLS_API_KEY_DETECT_BUSINESS_ANOMALIES:-}

  generate-kpis:
    build:
      context: .
      dockerfile: tools/generate_kpis/Docker/Dockerfile
    container_name: isotools-generate-kpis
    profiles: ["tools"]
    ports:
      - "8103:8101"
    environment:
      ISOTOOLS_API_URL: ${ISOTOOLS_API_URL:-https://tools.orcalabs.mx/api/v1}
      ISOTOOLS_API_KEY: ${ISOTOOLS_API_KEY_GENERATE_KPIS:-}

  api:
    build: .
    container_name: isotools-api
    profiles: ["api"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=industrial
      - DB_PASSWORD=industrial
      - DB_NAME=industrial_events
      - DATABASE_URL=postgresql://industrial:industrial@db:5432/industrial_events
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: npm run dev

  db:
    profiles: ["api", "seed"]
    image: postgres:16
    container_name: isotools-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=industrial
      - POSTGRES_PASSWORD=industrial
      - POSTGRES_DB=industrial_events
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial -d industrial_events"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    build: .
    profiles: ["seed"]
    command: ["node", "scripts/seedEvents.js", "200"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=industrial
      - DB_PASSWORD=industrial
      - DB_NAME=industrial_events
      - DATABASE_URL=postgresql://industrial:industrial@db:5432/industrial_events
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
